# Memasang node_exporter sebagai layanan systemd di semua server dalam grup [pantau].
# Jalankan: ansible-playbook -i inventory.ini install-node-exporter.yml
- hosts: pantau
  become: true
  vars:
    node_exporter_version: "1.8.2"
    # Batasi siapa yang boleh mengambil metrik (IP server pemantau)
    monitor_ip: "10.0.0.5"
  tasks:
    - name: Buat user sistem
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Unduh dan ekstrak node_exporter
      ansible.builtin.unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /opt
        remote_src: true
        creates: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64"

    - name: Pasang binary
      ansible.builtin.copy:
        src: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: "0755"
        remote_src: true
      notify: restart node_exporter

    - name: Buat layanan systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus node_exporter
          After=network-online.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: restart node_exporter

    - name: Izinkan port 9100 hanya dari server pemantau (ufw)
      community.general.ufw:
        rule: allow
        port: "9100"
        proto: tcp
        from_ip: "{{ monitor_ip }}"
      ignore_errors: true   # lewati kalau ufw tidak dipakai

    - name: Jalankan dan aktifkan saat boot
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
