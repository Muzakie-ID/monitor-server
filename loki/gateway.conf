# Gateway log: agen log di server target mengirim ke sini lewat HTTPS + basic auth.
# Sertifikat & kata sandi dibuat otomatis oleh provisioner (volume "secrets").
server {
  listen 3101 ssl;
  http2 on;
  ssl_certificate     /secrets/gateway/tls.crt;
  ssl_certificate_key /secrets/gateway/tls.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 10m;

  # Hanya endpoint push yang dibuka; membaca log hanya bisa dari dalam jaringan Docker
  location = /loki/api/v1/push {
    auth_basic           "pantau-logs";
    auth_basic_user_file /secrets/gateway/htpasswd;
    proxy_pass           http://loki:3100;
  }

  location / {
    return 404;
  }
}
