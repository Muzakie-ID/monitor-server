services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Skema dibuat & diperbarui oleh backend (src/migrate.js) setiap kali dijalankan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - targets:/etc/prometheus/targets
      - promdata:/prometheus
      # CA & kata sandi untuk mengambil metrik node_exporter yang dipasang otomatis (hanya baca)
      - secrets:/pantau-secrets:ro
    depends_on:
      provisioner:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    volumes:
      - ./blackbox:/etc/blackbox_exporter:ro
    command: --config.file=/etc/blackbox_exporter/blackbox.yml
    cap_add:
      - NET_RAW   # dibutuhkan untuk probe ICMP (ping)

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PROMETHEUS_URL: http://prometheus:9090
      TARGETS_FILE: /targets/nodes.json
      SECURE_TARGETS_FILE: /targets/nodes-secure.json
      PROVISIONER_URL: http://provisioner:4000
    volumes:
      - targets:/targets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      retries: 12

  # Memasang node_exporter & agen log ke server target lewat SSH.
  # Tidak membuka port ke luar; hanya backend yang memanggilnya.
  provisioner:
    build: ./provisioner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - secrets:/secrets      # kunci SSH pemantau, CA, kata sandi exporter & gateway log
      - provcache:/cache      # binary node_exporter/Alloy yang sudah dicek checksum-nya
    depends_on:
      backend:
        condition: service_healthy   # backend menjalankan migrasi database lebih dulu
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  # Penyimpanan log dari agen log (Grafana Alloy) di server target
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki

  # Pintu masuk log dari server target: TLS (sertifikat dari CA pemantau) + basic auth.
  # Hanya endpoint push yang dibuka.
  loki-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3101}:3101"
    volumes:
      - ./loki/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - secrets:/secrets:ro
    depends_on:
      provisioner:
        condition: service_healthy
      loki:
        condition: service_started

  nginx:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  promdata:
  targets:
  secrets:
  provcache:
  lokidata:
