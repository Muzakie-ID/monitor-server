groups:
  - name: server
    rules:
      - alert: ServerDown
        expr: probe_success{job="blackbox_icmp"} == 0
        for: 2m
        labels:
          severity: kritis
        annotations:
          summary: "Tidak merespons ping selama lebih dari 2 menit"

      - alert: CpuTinggi
        expr: 100 - avg by (server, region) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 85
        for: 15m
        labels:
          severity: sedang
        annotations:
          summary: "CPU di atas 85% selama 15 menit ({{ $value | printf \"%.0f\" }}%)"

      - alert: MemoriTinggi
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: sedang
        annotations:
          summary: "Memori terpakai di atas 90% ({{ $value | printf \"%.0f\" }}%)"

      - alert: DiskHampirPenuh
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) * 100 > 90
        for: 5m
        labels:
          severity: sedang
        annotations:
          summary: "Disk terisi di atas 90% ({{ $value | printf \"%.0f\" }}%)"
